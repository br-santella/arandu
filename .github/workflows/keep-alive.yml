name: supabase keep-alive

# The Supabase free plan pauses projects after ~1 week without activity.
# A light read every 3 days keeps the remote project awake (docs/04).
# Requires repository secrets SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY; skips otherwise.

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Light read through RLS (published points only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Secrets not configured yet; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 \
            "$SUPABASE_URL/rest/v1/point?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" > /dev/null
          echo "Supabase project is awake."
